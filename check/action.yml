name: iOS PR check
description: Unsigned build (simulator or device) on a self-hosted Mac; optionally run tests on a simulator.
inputs:
  scheme:
    required: true
  project:
    default: ''
  test:
    description: "'true' (default) runs the scheme's unit tests on an iPhone simulator (falls back to a build when the scheme has no tests); 'false' only builds"
    default: 'true'
  skip-ui-tests:
    description: "'true' (default) skips every *UITests target when running tests"
    default: 'true'
  skip-testing:
    description: 'Extra space-separated -skip-testing identifiers, e.g. "MyAppTests/SlowTests"'
    default: ''
  destination:
    description: "'simulator' (default) or 'device' (unsigned; use when an SDK has no arm64 simulator slice)"
    default: 'simulator'
  xcode:
    description: Xcode path or version (27.1, 27); empty = the repo's .xcode-version, else the runner default
    default: ''
  test-timeout-minutes:
    description: "Hard time limit for the test phase. Keep it below the job's timeout-minutes (40 in the reusable workflow) so a hung xcodebuild is stopped and cleaned up by check.sh, not by GitHub"
    default: '35'
runs:
  using: composite
  steps:
    - shell: zsh {0}
      env:
        SCHEME: ${{ inputs.scheme }}
        PROJECT: ${{ inputs.project }}
        RUN_TESTS: ${{ inputs.test }}
        BUILD_FOR: ${{ inputs.destination }}
        SKIP_UI_TESTS: ${{ inputs.skip-ui-tests }}
        SKIP_TESTING: ${{ inputs.skip-testing }}
        XCODE_APP: ${{ inputs.xcode }}
        TEST_TIMEOUT_MINUTES: ${{ inputs.test-timeout-minutes }}
      # exec: when the job is cancelled the runner signals only this step's process (SIGINT, SIGTERM 7.5 s
      # later, SIGKILL 2.5 s after that). exec makes that process check.sh itself, so its traps can stop
      # xcodebuild, delete the simulator and release the lock; a wrapper shell would just wait for it.
      run: exec ${{ github.action_path }}/../check.sh
    - if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: xcodebuild-logs
        path: ${{ runner.temp }}/ios-ci/*.log
        retention-days: 7
