name: iOS PR check
description: Unsigned build (simulator or device) on a self-hosted Mac; optionally run tests on a simulator.
inputs:
  scheme:
    required: true
  project:
    default: ''
  test:
    description: "'true' (default) runs the scheme's unit tests on an iPhone simulator (falls back to a build when the scheme has no tests); 'false' only builds"
    default: 'true'
  skip-ui-tests:
    description: "'true' (default) skips every *UITests target when running tests"
    default: 'true'
  skip-testing:
    description: 'Extra space-separated -skip-testing identifiers, e.g. "MyAppTests/SlowTests"'
    default: ''
  destination:
    description: "'simulator' (default) or 'device' (unsigned; use when an SDK has no arm64 simulator slice)"
    default: 'simulator'
  xcode:
    description: Xcode path or version (27.1, 27); empty = the repo's .xcode-version, else the runner default
    default: ''
runs:
  using: composite
  steps:
    - shell: zsh {0}
      env:
        SCHEME: ${{ inputs.scheme }}
        PROJECT: ${{ inputs.project }}
        RUN_TESTS: ${{ inputs.test }}
        BUILD_FOR: ${{ inputs.destination }}
        SKIP_UI_TESTS: ${{ inputs.skip-ui-tests }}
        SKIP_TESTING: ${{ inputs.skip-testing }}
        XCODE_APP: ${{ inputs.xcode }}
      run: ${{ github.action_path }}/../check.sh
    - if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: xcodebuild-logs
        path: ${{ runner.temp }}/ios-ci/*.log
        retention-days: 7
