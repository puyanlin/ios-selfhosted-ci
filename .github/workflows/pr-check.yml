# Reusable: unsigned PR build on the self-hosted Mac.
# Call it from an app repo: uses: puyanlin/ios-selfhosted-ci/.github/workflows/pr-check.yml@v1
# The resulting check is named "<caller job id> / build", e.g. "pr-check / build" — use that in rulesets.
name: PR check
on:
  workflow_call:
    inputs:
      scheme: { type: string, required: true, description: 'Scheme; several space-separated candidates allowed' }
      project: { type: string, default: '' }
      destination: { type: string, default: simulator, description: "simulator or device (unsigned)" }
      test: { type: boolean, default: true, description: 'Run unit tests on an iPhone simulator (UI tests skipped; falls back to a build when the scheme has no tests). false = build only' }
      skip-ui-tests: { type: boolean, default: true }
      skip-testing: { type: string, default: '', description: 'Extra space-separated -skip-testing identifiers' }
      xcode: { type: string, default: '', description: 'Xcode path or version (27.1, 27); empty = .xcode-version, else the runner default' }
      runner-label: { type: string, default: macos-xcode }
jobs:
  build:
    runs-on: [self-hosted, "${{ inputs.runner-label }}"]
    concurrency:
      group: pr-check-${{ github.repository }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: puyanlin/ios-selfhosted-ci/check@v1
        with:
          scheme: ${{ inputs.scheme }}
          project: ${{ inputs.project }}
          destination: ${{ inputs.destination }}
          test: ${{ inputs.test }}
          skip-ui-tests: ${{ inputs.skip-ui-tests }}
          skip-testing: ${{ inputs.skip-testing }}
          xcode: ${{ inputs.xcode }}
