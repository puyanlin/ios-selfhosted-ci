# Kept for existing callers: same as ai-review.yml with provider: claude.
name: Claude review
on:
  workflow_call:
    inputs:
      model: { type: string, default: claude-opus-5-5 }
      claude-path: { type: string, default: '' }
      bun-path: { type: string, default: '' }
      runner-label: { type: string, default: claude-review }
      language: { type: string, default: English }
      show-full-output: { type: boolean, default: false }
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: { required: true }
jobs:
  review:
    uses: puyanlin/ios-selfhosted-ci/.github/workflows/ai-review.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      provider: claude
      model: ${{ inputs.model }}
      language: ${{ inputs.language }}
      claude-path: ${{ inputs.claude-path }}
      bun-path: ${{ inputs.bun-path }}
      runner: '["self-hosted","${{ inputs.runner-label }}"]'
      show-full-output: ${{ inputs.show-full-output }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
