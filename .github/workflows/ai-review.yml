# Reusable: AI code review on pull requests. Pick the provider the runner's owner uses — each runs through its own
# CLI on your Mac, signed in the way you already use it (subscription or API key), with one shared prompt
# (review/prompt.md) and one shared way of posting (a PR review with inline comments + a summary).
#   provider: claude (default)  Claude Code — secret CLAUDE_CODE_OAUTH_TOKEN (claude setup-token)
#   provider: codex             OpenAI Codex CLI — the runner's `codex login` (ChatGPT) or secret OPENAI_API_KEY
#   provider: gemini            Gemini CLI — the runner's Google sign-in or secret GEMINI_API_KEY
# runner: auto = your Mac's `claude-review` runner. '"ubuntu-latest"' also works: the CLI is installed there
# and an API-key secret is required.
# Callers: `secrets: inherit` and permissions contents: read, pull-requests: write.
name: AI review
on:
  workflow_call:
    inputs:
      provider: { type: string, default: claude }
      model: { type: string, default: '', description: 'Empty = provider default (claude-opus-5-5 for Claude)' }
      language: { type: string, default: English }
      claude-path: { type: string, default: '', description: 'Claude Code binary on the runner' }
      bun-path: { type: string, default: '', description: 'Unused (kept for older callers)' }
      runner: { type: string, default: auto, description: 'auto, or a runs-on value as JSON, e.g. "ubuntu-latest"' }
      show-full-output: { type: boolean, default: false, description: 'Unused (kept for older callers)' }
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: { required: false }
      OPENAI_API_KEY: { required: false }
      GEMINI_API_KEY: { required: false }
jobs:
  review:
    # Never review fork PRs with repository secrets.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(inputs.runner != 'auto' && inputs.runner || '["self-hosted","claude-review"]') }}
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: puyanlin/ios-selfhosted-ci/review@v1
        with:
          provider: ${{ inputs.provider }}
          model: ${{ inputs.model }}
          language: ${{ inputs.language }}
          claude-path: ${{ inputs.claude-path }}
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
