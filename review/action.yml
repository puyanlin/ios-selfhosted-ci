name: AI PR review
description: Review a pull request with Claude, OpenAI Codex or Google Gemini through their CLIs, with one shared prompt and one shared way of posting (inline comments + a summary).
inputs:
  provider:
    description: claude | codex | gemini
    default: claude
  model:
    description: "Model ID; empty = the provider's default (claude-opus-5-5 for Claude)"
    default: ''
  language:
    default: English
  claude-path:
    description: "Claude Code binary on the runner (default: claude on PATH)"
    default: ''
  claude-token:
    default: ''
  openai-api-key:
    description: "Optional; without it, Codex uses the runner user's codex login (e.g. ChatGPT sign-in)"
    default: ''
  gemini-api-key:
    description: "Optional; without it, Gemini uses the runner user's Google sign-in"
    default: ''
runs:
  using: composite
  steps:
    - id: prep
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        LANGUAGE: ${{ inputs.language }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        TITLE: ${{ github.event.pull_request.title }}
        TEMPLATE: ${{ github.action_path }}/prompt.md
      run: |
        set -euo pipefail
        WORK="$RUNNER_TEMP/ai-review"; rm -rf "$WORK"; mkdir -p "$WORK"
        # The diff goes inside the workspace so every CLI can read it from its (read-only) sandbox.
        mkdir -p .ai-review && gh pr diff "$PR" --repo "$REPO" > .ai-review/pr.diff
        export DIFF=.ai-review/pr.diff
        python3 - "$TEMPLATE" "$WORK/prompt.md" <<'PY'
        import os,sys
        t=open(sys.argv[1]).read()
        for k in ('REPO','PR','TITLE','LANGUAGE','DIFF'):
            t=t.replace('{{'+k+'}}', os.environ[k])
        open(sys.argv[2],'w').write(t)
        PY
        echo "work=$WORK" >> "$GITHUB_OUTPUT"
    - shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        PROMPT_FILE: ${{ steps.prep.outputs.work }}/prompt.md
        SCHEMA_FILE: ${{ github.action_path }}/schema.json
        WORK: ${{ steps.prep.outputs.work }}
        CLAUDE_PATH: ${{ inputs.claude-path }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-token }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
      run: ${{ github.action_path }}/run.sh
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: python3 ${{ github.action_path }}/post.py "${{ steps.prep.outputs.work }}/review.json" "${{ inputs.provider }}${{ inputs.model && format(' · {0}', inputs.model) || '' }}"
