# The pipeline lives in __CI_REPO__; this file only holds this repo's settings.
# Run it from GitHub › Actions › TestFlight › Run workflow (works from the GitHub mobile app too).
name: TestFlight
run-name: TestFlight ${{ inputs.branch || github.ref_name }}${{ !inputs.upload && ' (dry run)' || '' }}
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch / tag / commit to build (empty = the branch selected above; it does not need to contain this workflow)'
        default: ''
      upload:
        description: 'Upload to App Store Connect (untick = archive only, dry run)'
        type: boolean
        default: true
      xcode:
        description: 'Xcode: default = the repo .xcode-version, else the release Xcode (beta builds cannot be submitted for review)'
        type: choice
        options: ['default', __XCODE_OPTIONS__]
        default: 'default'
      build-number:
        description: 'Empty = today YYMMDD01 (Xcode bumps it if already taken)'
        default: ''
jobs:
  testflight:
    uses: __CI_REPO__/.github/workflows/testflight.yml@__CI_REF__
    with:
      scheme: __SCHEME__
      team-id: __TEAM_ID__
__WITH__
      branch: ${{ inputs.branch }}
      upload: ${{ inputs.upload }}
      xcode: ${{ inputs.xcode }}
      build-number: ${{ inputs.build-number }}
