# The pipeline (provider, model, prompt) lives in __CI_REPO__; this file only triggers it.
# provider: claude (default) | codex | gemini — runs through that CLI on your Mac (see the README)
name: AI review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  review:
    uses: __CI_REPO__/.github/workflows/ai-review.yml@__CI_REF__
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
    with:
      provider: __PROVIDER__
__REVIEW_WITH__
