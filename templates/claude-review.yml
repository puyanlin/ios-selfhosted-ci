# The pipeline (model, prompt) lives in __CI_REPO__; this file only triggers it.
name: Claude review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  review:
    uses: __CI_REPO__/.github/workflows/claude-review.yml@__CI_REF__
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    secrets: inherit
__REVIEW_WITH__
